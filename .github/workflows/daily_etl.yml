name: Daily B3 Market ETL Pipeline

on:
  schedule:
    # Runs at 22:00 UTC (19:00 BRT) Monday through Friday, after B3 market close
    - cron: "0 22 * * 1-5"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  run-etl:
    name: Extract, Transform & Load B3 Market Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        run: |
          python -m backend.etl

      - name: Run Unit Tests
        run: |
          pytest tests/ -v

      - name: Commit and push updated market data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes in market data to commit."
          else
            git commit -m "chore(data): automated daily B3 market ETL update [skip ci]"
            git push
          fi
